<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Image Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .header {
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      color: #333;
      font-weight: 600;
    }
    .status {
      margin: 20px 0;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .status.info { background: #e3f2fd; color: #1976d2; }
    .status.success { background: #e8f5e8; color: #2e7d32; }
    .status.warning { background: #fff3e0; color: #f57c00; }
    .status.error { background: #ffebee; color: #d32f2f; }
    .image-container {
      position: relative;
      margin: 20px 0;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    img:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }
    img.tracking {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
      50% { box-shadow: 0 8px 16px rgba(0,0,0,0.1), 0 0 0 8px rgba(102, 126, 234, 0.3); }
      100% { box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    }
    .controls {
      margin-top: 20px;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0 5px;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5a6fd8;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
      display: none;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📍 Location Image Tracker</h1>
    </div>
    <div id="status" class="status info">Click the image to start location tracking</div>
    <div class="image-container">
      <img id="img" src="{{ img_url }}" onclick="startTracking()" alt="Tracked Image" />
    </div>
    <div class="controls">
      <button id="stopBtn" class="btn-secondary" onclick="stopTracking()">Stop Tracking</button>
    </div>
    <div class="footer">
      ⚠️ This is for educational purposes only. Location data is logged server-side.
    </div>
  </div>

<script>
const statusEl = document.getElementById('status');
const img = document.getElementById('img');
const stopBtn = document.getElementById('stopBtn');
let watchId = null;

function updateStatus(message, type = 'info') {
  statusEl.textContent = message;
  statusEl.className = `status ${type}`;
}

function sendLocation(pos) {
  const payload = {
    image: "{{ image_id }}",
    lat: pos.coords.latitude,
    lon: pos.coords.longitude,
    accuracy: pos.coords.accuracy,
    ts: new Date().toISOString()
  };
  fetch("/report", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  }).then(() => {
    updateStatus(`Tracking active (±${Math.round(pos.coords.accuracy)}m)`, 'success');
  }).catch(e => {
    console.warn(e);
    updateStatus("Error sending location", 'error');
  });
}

function startTracking() {
  if (!navigator.geolocation) {
    updateStatus('Geolocation not supported on this device.', 'error');
    return;
  }
  updateStatus('Requesting location access...', 'warning');
  img.classList.add('tracking');
  img.style.cursor = 'default';
  img.onclick = null;
  stopBtn.style.display = 'inline-block';

  watchId = navigator.geolocation.watchPosition(sendLocation, (err) => {
    img.classList.remove('tracking');
    let errorMsg = 'Location access denied or error occurred.';
    if (err.code === 1) errorMsg = 'Location permission denied. Please allow access.';
    else if (err.code === 2) errorMsg = 'Location unavailable. Check GPS settings.';
    else if (err.code === 3) errorMsg = 'Location request timed out.';
    updateStatus(errorMsg, 'error');
    resetUI();
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

function stopTracking() {
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  updateStatus('Tracking stopped.', 'info');
  resetUI();
}

function resetUI() {
  img.classList.remove('tracking');
  img.style.cursor = 'pointer';
  img.onclick = startTracking;
  stopBtn.style.display = 'none';
}
</script>
</body>
</html>
